[package]
name = "thermal-cli"
version = "0.1.0"
edition = "2024"
description = "A polished hardware temperature monitor for Linux terminals"
license = "MIT"
keywords = ["temperature", "hardware", "monitoring", "cli", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hostname = "0.4"
supports-color = "3.0"
