[package]
name = "push-notify"
version = "0.1.0"
edition = "2024"
description = "Extensible push notification channels with ServerChan support"
license = "MIT"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
